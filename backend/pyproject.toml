[project]
name = "specforge-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B008: FastAPI's Depends() in defaults is idiomatic; E741/E731: short lambdas/names in comprehensions
ignore = ["B008", "E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

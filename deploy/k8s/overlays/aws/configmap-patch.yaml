apiVersion: v1
kind: ConfigMap
metadata:
  name: specforge-config
  namespace: specforge
data:
  ENVIRONMENT: production
  STORAGE_BACKEND: s3
  S3_BUCKET: REPLACE_WITH_TERRAFORM_OUTPUT   # set by Ansible from `terraform output -raw s3_bucket`
  AWS_REGION: us-east-1
  LLM_PROVIDER: heuristic
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini

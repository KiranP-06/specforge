# EXAMPLE ONLY — real values are created by Ansible (roles/app) from Ansible Vault,
# or manually:  kubectl -n specforge create secret generic specforge-secrets \
#   --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_SECRET=... \
#   --from-literal=DATABASE_URL=postgresql+psycopg://specforge:...@postgres:5432/specforge --from-literal=LLM_API_KEY=
apiVersion: v1
kind: Secret
metadata:
  name: specforge-secrets
  namespace: specforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: change-me-to-64-hex-chars
  DATABASE_URL: postgresql+psycopg://specforge:change-me@postgres:5432/specforge
  LLM_API_KEY: ""

apiVersion: v1
kind: ConfigMap
metadata:
  name: specforge-config
  namespace: specforge
data:
  ENVIRONMENT: production
  INLINE_JOBS: "false"
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: heuristic          # switch to openai / anthropic and set LLM_API_KEY in the secret
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  USE_TRANSFORMER_MODELS: "false"
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /app/data
  AUTO_CREATE_TABLES: "false"     # schema is managed by Alembic (initContainer below)
  UVICORN_WORKERS: "1"
  CORS_ORIGINS: "*"

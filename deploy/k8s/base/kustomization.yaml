apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: specforge
labels:
  - pairs: { app.kubernetes.io/part-of: specforge }
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml

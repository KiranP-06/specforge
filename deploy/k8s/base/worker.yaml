apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: specforge
  labels: { app: worker }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: worker
          image: specforge-api
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
          envFrom:
            - configMapRef: { name: specforge-config }
            - secretRef: { name: specforge-secrets }
          livenessProbe:
            exec: { command: ["sh", "-c", "celery -A app.worker.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"] }
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1536Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: specforge
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: specforge
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_DB, value: specforge }
            - { name: POSTGRES_USER, value: specforge }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: specforge-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "specforge", "-d", "specforge"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "specforge", "-d", "specforge"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path   # k3s default provisioner
        resources: { requests: { storage: 10Gi } }

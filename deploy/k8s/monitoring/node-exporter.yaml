apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: monitoring, labels: { app: node-exporter } }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata:
      labels: { app: node-exporter }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
    spec:
      hostPID: true
      hostNetwork: true
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: [--path.rootfs=/host, --no-collector.wifi, --no-collector.hwmon]
          ports: [{ containerPort: 9100, hostPort: 9100 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts: [{ name: root, mountPath: /host, readOnly: true, mountPropagation: HostToContainer }]
      volumes: [{ name: root, hostPath: { path: / } }]

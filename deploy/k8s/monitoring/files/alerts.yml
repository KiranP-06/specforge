groups:
  - name: specforge
    rules:
      - alert: SpecforgeApiDown
        expr: sum(up{app="api"}) < 1 or absent(up{app="api"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "No healthy SPECForge API pod is being scraped" }
      - alert: SpecforgeHigh5xxRate
        expr: |
          (sum(rate(specforge_http_requests_total{status=~"5.."}[5m])) or vector(0))
            / clamp_min(sum(rate(specforge_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of API requests are failing" }
      - alert: SpecforgeSlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(specforge_http_request_duration_seconds_bucket{route!~"/metrics|/health|/ready"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "API p95 latency above 2 s" }
      - alert: SpecforgeQueueBacklog
        expr: max(specforge_queue_backlog) > 20
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Celery queue backlog above 20 jobs" }
      - alert: SpecforgeJobsFailing
        expr: increase(max by (kind) (specforge_jobs{status="failed"})[30m:]) > 3
        labels: { severity: warning }
        annotations: { summary: "Several blueprint jobs failed in the last 30 minutes" }
      - alert: NodeMemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Node memory above 90%" }
      - alert: NodeDiskFilling
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Root disk above 85%" }

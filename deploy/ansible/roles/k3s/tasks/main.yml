---
- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s (single node, Traefik ingress, local-path storage)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server --write-kubeconfig-mode 0640 --tls-san {{ inventory_hostname }} --kubelet-arg=max-pods=60
      --cluster-cidr=10.52.0.0/16 --service-cidr=10.53.0.0/16
  args:
    creates: /usr/local/bin/k3s

- name: Wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Create kubeconfig group so non-root users (runner) can use kubectl
  ansible.builtin.group:
    name: k3s
    state: present

- name: Give the k3s group read access to the kubeconfig
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    group: k3s
    mode: "0640"

- name: Export KUBECONFIG for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/k3s.sh
    content: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\n"
    mode: "0644"

- name: Add ubuntu to k3s group
  ansible.builtin.user:
    name: ubuntu
    groups: k3s
    append: true
